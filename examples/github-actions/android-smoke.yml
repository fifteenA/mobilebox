# Copy to .github/workflows/android-smoke.yml in your Android repo, next to smoke.mjs.
# Add the repository secret MOBILESANDBOX_API_KEY. Give CI its own named key so you can rotate it alone;
# it still shares phones and credit with the workspace's other keys.
name: android-smoke
on:
  push:
    branches: [main]   # not pull_request: GitHub withholds secrets from fork PRs
  workflow_dispatch:
permissions:
  contents: read
concurrency: android-smoke   # one run at a time: a workspace runs at most 3 phones
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: ./gradlew assembleDebug
      - run: node smoke.mjs
        env:
          MOBILESANDBOX_API_KEY: ${{ secrets.MOBILESANDBOX_API_KEY }}
          APK_FILE: app/build/outputs/apk/debug/app-debug.apk
          EXPECTED_PACKAGE: com.example.app
          EXPECTED_LABEL: Welcome
